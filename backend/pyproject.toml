[project]
name = "paper-portfolio-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "apscheduler>=3.10",
  "feedparser>=6.0",
  "httpx>=0.27",
  "openai-agents>=0.0.17",
  "alpaca-py>=0.33",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
